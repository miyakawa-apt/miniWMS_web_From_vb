# PostgreSQL 17（開発用）
# 接続情報は .env に書く（.env.example を複製して値を設定）。.env はコミットしない。
services:
  db:
    image: postgres:17
    container_name: miniwms-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env に POSTGRES_DB を設定してください}
      POSTGRES_USER: ${POSTGRES_USER:?.env に POSTGRES_USER を設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - miniwms-pgdata:/var/lib/postgresql/data
      # 初回起動時（データ領域が空のとき）だけ、スキーマを流し込む
      - ./dumps/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  miniwms-pgdata:
